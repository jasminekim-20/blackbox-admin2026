<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKBOX | 모집 안내</title>
  <style>
    :root {
      --orange: #ff7a1a;
      --black: #050506;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--black);
      background: #fff;
      font-family: "Noto Sans KR", "Inter", system-ui, sans-serif;
    }
    main {
      text-align: center;
    }
    h1 {
      margin: 0;
      color: var(--orange);
      font-size: clamp(1.05rem, 3vw, 1.55rem);
      font-weight: 600;
      letter-spacing: -.02em;
    }
  </style>
</head>
<body>
  <main>
    <h1>지금은 모집 기간이 아닙니다.</h1>
  </main>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
